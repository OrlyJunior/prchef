name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        options: [patch, minor, major]
      notes:
        description: Optional release body (leave empty to generate release notes)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Releases must be run from develop; selected ref is $GITHUB_REF"
            exit 1
          fi

  ci:
    needs: validate-develop
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag-and-release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch release tags
        run: git fetch --force --tags origin develop
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          pattern = re.compile(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\Z")
          versions = [tuple(map(int, match.groups())) for tag in tags if (match := pattern.fullmatch(tag))]
          bump = os.environ["BUMP"]
          if not versions:
              next_version = (0, 1, 0)
          else:
              major, minor, patch = max(versions)
              if bump == "major":
                  next_version = (major + 1, 0, 0)
              elif bump == "minor":
                  next_version = (major, minor + 1, 0)
              elif bump == "patch":
                  next_version = (major, minor, patch + 1)
              else:
                  raise SystemExit(f"Unsupported bump: {bump}")
          tag = "v" + ".".join(map(str, next_version))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          print(f"Next release tag: {tag}")
          PY
      - name: Ensure tag does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
      - name: Tag checked-out develop commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Verify distribution names and versions
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected = os.environ["TAG"][1:]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, found {wheels} and {sdists}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_files = [name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit("Wheel metadata is missing or ambiguous")
              wheel_metadata = email.message_from_bytes(wheel.read(metadata_files[0]))
              wheel_version = wheel_metadata["Version"]
              if "prchef/__init__.py" not in wheel.namelist():
                  raise SystemExit("Wheel is missing the prchef package")
          with tarfile.open(sdists[0], "r:gz") as sdist:
              metadata_files = [item for item in sdist.getmembers() if item.name.endswith("/PKG-INFO")]
              if len(metadata_files) != 1:
                  raise SystemExit("Sdist metadata is missing or ambiguous")
              source = sdist.extractfile(metadata_files[0])
              if source is None:
                  raise SystemExit("Cannot read sdist metadata")
              sdist_metadata = email.message_from_bytes(source.read())
              sdist_version = sdist_metadata["Version"]
          if wheel_metadata["Name"] != "prchef" or sdist_metadata["Name"] != "prchef":
              raise SystemExit("Wheel and sdist must both be named prchef")
          if wheel_version != expected or sdist_version != expected:
              raise SystemExit(
                  f"Expected version {expected}; wheel has {wheel_version}, sdist has {sdist_version}"
              )
          print(f"Wheel and sdist are named prchef and both have version {expected}")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          notes_args=(--generate-notes)
          if [[ -n "$NOTES" ]]; then
            printf '%s' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
            notes_args=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          gh release create "$TAG" dist/*.tar.gz dist/*.whl --verify-tag "${notes_args[@]}" --title "$TAG"
