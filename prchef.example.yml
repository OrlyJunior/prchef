task:
  # Provider used by `prchef run --task-id ...`.
  # --github-issue explicitly selects the GitHub provider.
  provider: github
  # Experimental Trello task source (not tested against a live board):
  # provider: trello
  # --trello-card explicitly selects this experimental provider.

defaults:
  # Persistent execution state is global, never repository-local. Relative paths
  # are resolved from this global configuration file.
  # persistence:
  #   database_path: state/prchef.db
  # Worktrees default to ~/.prchef/workspaces/<repo>/<execution-id>.
  # Override globally here or under repositories.<key>. The root must stay
  # outside the configured repository checkout.
  # workspace:
  #   root: C:/prchef/workspaces
  repository:
    base_branch: develop
    protected_branches: [main, master, develop]
  # Registered repositories use local Qdrant by default. The first run builds
  # the persistent index and downloads the embedding model if needed.
  repository_context:
    # Omit this line for the same local Qdrant default. Change it to
    # strategy: heuristic to use the previous bounded context.
    strategy: qdrant
    # context_budget_chars: 12000
    # candidate_count: 12
    # chunk_size_chars: 1600
    # chunk_overlap_chars: 200
    # embedding:
    #   provider: fastembed
    #   model: BAAI/bge-small-en-v1.5
    #   version: "1"
    #   dimension: 384
    #   cpu_threads: 2  # bounded local embedding CPU threads
    # qdrant:
    #   mode: local
    #   # Persistent and external to every repository. Omit for
    #   # ~/.prchef/qdrant. Local mode is single-process only.
    #   path: C:/prchef/qdrant
    # Server mode supports concurrent prchef processes instead:
    # qdrant:
    #   mode: server
    #   url: http://127.0.0.1:6333
    # Or use `host: 127.0.0.1` with optional `port: 6333`, not both URL and host.
  agents:
    # API models return text/structured output: they can plan and review.
    # The implementer needs Codex CLI or Claude Code to edit the worktree.
    planner:
      provider: cloud-api
      # Optional one-hop failover to a role-local named preset. It is used only
      # for quota, rate-limit, or temporary provider-capacity failures.
      # fallback_preset: cloud-backup
    implementer:
      provider: codex
    reviewer:
      provider: cloud-api
    # Optional Vertex AI example: the same instance can serve the planner and reviewer.
    # planner:
    #   provider: vertex-gemini
    # reviewer:
    #   provider: vertex-gemini
  # Reusable presets are role-local and never modify provider definitions.
  # Precedence: launch value > preset > repository provider > global provider > backend default.
  # Define presets here or in repositories.<key>.agent_presets; the preset editor
  # writes the latter in this global file. Hidden generation keys are preserved.
  # agent_presets:
  #   planner:
  #     cloud-backup:
  #       provider: cloud-api
  #       model: openai/gpt-4.1-mini
  #     # One Claude provider can use role-local permission modes without duplicate definitions.
  #     claude-read-only:
  #       provider: claude
  #       # Claude accepts low, medium, high, xhigh, or max per role.
  #       reasoning_effort: medium
  #       permission_mode: dontAsk
  #   implementer:
  #     focused:
  #       provider: codex
  #       model: <your-supported-codex-model>
  #       reasoning_effort: medium
  #     claude-edit:
  #       provider: claude
  #       permission_mode: acceptEdits
  safety:
    allow_direct_merge: false
    require_tests: true
  validation:
    auto_detect: true
    # Commands run in the execution worktree. Choose tools installed for that project.
    commands: []
    # Correction attempts in the same worktree after validation fails.
    max_validation_retries: 2
  review:
    # Correction attempts in the same worktree after a review requests changes.
    # Each correction validates, creates a new commit, and updates the existing PR before review.
    max_review_retries: 1
  notifications:
    # Desktop alerts are opt-in. Windows is supported in this first version.
    enabled: false
    channel: desktop
  # Every named provider accepts `max_concurrency`: how many agent calls that
  # one provider may run at the same time across all concurrent executions in
  # this process. The named provider *is* the shared resource — one API quota
  # pool, or one GPU's VRAM for a local model — so the ceiling belongs here
  # rather than to a single global number.
  #
  # It defaults to 1 (strictly sequential) when omitted, which is deliberately
  # conservative. Ceilings are read once at startup: changing one requires
  # restarting `prchef run`/`tui`. Declare it only under
  # `defaults.providers.<name>`; a `repositories.<key>.providers.<name>` entry
  # that sets `max_concurrency` is rejected with a configuration error.
  # Providers screen choices: Codex CLI (codex-cli), Claude Code (claude-code),
  # Model API (LiteLLM) (litellm). Connection fields are separate from defaults
  # for model, effort and permissions; a preset or launch value can override them.
  providers:
    codex:
      type: codex-cli
      # Two Codex agent calls may be in flight at once; a third queues (FIFO)
      # and its execution is reported as WAITING until a slot frees up.
      max_concurrency: 2
      # Set these values to options supported by your Codex CLI; do not rely on its defaults.
      # model: <your-supported-codex-model>
      # reasoning_effort: <your-supported-reasoning-effort>
      command: [codex, exec, --sandbox, workspace-write, --output-last-message, "{output_file}", -]
      timeout_seconds: 3600
      # Optional: use the Codex CLI's automatic review mode.
      # It implies workspace-write and cannot be combined with --sandbox.
      # approval_policy: approve-for-me
    # Claude Code needs a recent `claude` CLI with `--output-format json`,
    # `--json-schema`, `--restricted`, and `--permission-prompts`. Authenticate outside this
    # YAML. Subscription users leave bare_mode off (false by default).
    # Optional bare mode skips user hooks, plugins, skills, and MCP
    # auto-discovery for reproducible runs. It requires ANTHROPIC_API_KEY or
    # supported cloud credentials; it does not use subscription login credentials.
    # The provider always uses restricted, file-only tools in the supplied
    # worktree with or without bare mode. `--restricted` confines file tools
    # to that worktree; MCP, Bash, and Git lifecycle actions remain blocked.
    # claude:
    #   type: claude-code
    #   executable: claude
    #   timeout_seconds: 1800
    #   # model: <your-supported-claude-model>
    #   # Optional native Claude thinking depth: low, medium, high, xhigh, or max.
    #   # When omitted, no --effort flag is sent and Claude's CLI default applies.
    #   # effort: medium
    #   # Default for roles without a preset/TUI runtime override. `dontAsk` is
    #   # suitable for read-only roles; use `acceptEdits` only for a role
    #   # permitted to edit prchef-created workspace.
    #   permission_mode: dontAsk
    #   bare_mode: false
    #   # max_turns: 12
    #   # max_budget_usd: 5.00
    # Gemini on Vertex is a Model API template using LiteLLM's vertex_ai/ route.
    # Complete the model prefix and project placeholder supplied by the screen.
    # Authenticate outside the screen with ADC, e.g. `gcloud auth application-default login`.
    # Legacy type: gemini-vertex entries convert in memory on load; YAML stays unchanged.
    # vertex-gemini:
    #   type: litellm
    #   model: vertex_ai/gemini-2.5-flash
    #   timeout_seconds: 900
    #   temperature: 0.2
    #   # max_output_tokens: 8192
    #   generation:
    #     vertex_project: my-gcp-project
    #     vertex_location: global
    # LiteLLM is the primary API model backend and is included in the standard installation.
    # A non-empty base model is required, even when a preset overrides it.
    # A key is referenced by its environment variable name only. Without this
    # reference, LiteLLM uses backend environment/ambient credentials (including
    # Vertex ADC) or a local endpoint. Keep secret values out of this file.
    # local-ollama:
    #   type: litellm
    #   model: ollama/llama3.2
    #   api_base: http://localhost:11434
    #   # Local models share one GPU's VRAM no matter which execution owns them.
    #   # Keep this at 1 unless the card demonstrably fits concurrent requests.
    #   max_concurrency: 1
    #   timeout_seconds: 120
    #   temperature: 0.2
    #   max_output_tokens: 4096
    #   generation:
    #     top_p: 0.9
    cloud-api:
      type: litellm
      model: openai/gpt-4.1-mini
      # Export this variable in prchef process environment. The app's
      # ~/.prchef/.env does not export arbitrary API provider credentials.
      api_key_env: OPENAI_API_KEY
      # A hosted account has its own finite quota pool, independent of the
      # Codex ceiling above: the two admit concurrently.
      max_concurrency: 3
  integrations:
    github:
      command: [gh]
      timeout_seconds: 120
      # Configure independent App identities for implementation and review; see docs/github_app.md.
      # Never version the private key.
      # implementer_app:
      #   app_id: 123456
      #   installation_id: 987654
      #   private_key_path: C:/secure/implementer-github-app-private-key.pem
      # app:
      #   app_id: 123456
      #   installation_id: 987654
      #   private_key_path: C:/secure/github-app-private-key.pem
      #   # Alternative: private_key_env: GITHUB_APP_PRIVATE_KEY

# For GitHub Issues, use the owner/repository key of the local clone.
repositories:
  owner/example-api:
    path: /absolute/path/to/example-api
    repository:
      # Replace with a branch that exists on this repository's remote.
      base_branch: develop
    validation:
      commands:
        - [python, -m, pytest]
        - [python, -m, ruff, check, .]
