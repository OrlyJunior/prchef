[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-dev-orchestrator"
version = "0.1.0"
description = "Orquestrador CLI para tasks do Trello/GitHub, Jules, Codex e Git"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "google-genai>=1.75,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT[crypto]>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "ruamel.yaml>=0.18,<1",
  "SQLAlchemy>=2.0,<3",
  "textual>=0.58,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
litellm = [
  "litellm>=1.0.0",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp/run"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orchestrator"]
