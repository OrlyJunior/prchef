[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prchef"
version = "0.1.0"
description = "Plan, implement, validate, and review GitHub or Trello tasks in isolated Git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Orly Antunes Borges Júnior (OrlyJunior)"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  # 1.107.0 was a malicious release; bump deliberately after checking advisories.
  "litellm==1.106.2",
  "numpy>=1.26,<2.5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT[crypto]>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "qdrant-client[fastembed]>=1.12,<2",
  "ruamel.yaml>=0.18,<1",
  "SQLAlchemy>=2.0,<3",
  "textual>=0.58,<2",
  "typer>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/OrlyJunior/prchef"
Issues = "https://github.com/OrlyJunior/prchef/issues"
Changelog = "https://github.com/OrlyJunior/prchef/releases"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "editables~=0.3",
  "hatchling>=1.27",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
prchef = "prchef.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prchef"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp/run"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prchef"]

# jsonschema is typed by the optional development dependency above. Keep type
# validation usable in environments where that optional stub is not provisioned.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.exceptions"]
ignore_missing_imports = true
