task:
  # Provider usado com `orchestrator run --task-id ...`.
  # --trello-card e --github-issue selecionam explicitamente o provider.
  provider: github

defaults:
  workspace:
    # Worktrees are created outside the configured repository checkout.
    root: C:/Git/orchestrator-workspaces
  repository:
    base_branch: develop
    protected_branches: [main, master, develop]
  agents:
    planner:
      provider: jules
    implementer:
      provider: codex
    reviewer:
      provider: jules
    # Exemplo Vertex AI: a mesma instancia pode atender planner e reviewer.
    # planner:
    #   provider: vertex-gemini
    # reviewer:
    #   provider: vertex-gemini
  safety:
    allow_direct_merge: false
    require_tests: true
  validation:
    auto_detect: true
    # `python -m pytest` usa .pytest-tmp/run automaticamente via pyproject.toml.
    commands: []
    # Tentativas de correcao no mesmo worktree apos uma validacao falhar.
    max_validation_retries: 2
  review:
    # Tentativas de correcao no mesmo worktree apos uma revisao pedir mudancas.
    # Cada correcao valida, cria um novo commit e atualiza a PR existente antes de nova revisao.
    max_review_retries: 1
  providers:
    jules:
      type: jules
      # API oficial de sessoes (sem launcher stdin/stdout). Exporte JULES_API_KEY.
      # A CLI oficial pode ser usada para login e inspecao manual: jules login.
      # Source opcional; se ausente, resolve pelo remote GitHub de origin.
      # source: sources/github-owner-repository
      # Polling dos estados remotos; 1800 s e o timeout global da operacao.
      # AWAITING_USER_FEEDBACK, PAUSED e AWAITING_PLAN_APPROVAL encerram em NEEDS_HUMAN.
      poll_interval_seconds: 15
      timeout_seconds: 1800
      poll_retry_attempts: 3
      poll_retry_backoff_seconds: 2
    codex:
      type: codex-cli
      # Fixe estes valores com opcoes suportadas pela sua Codex CLI; nao dependa do default externo.
      # model: <your-supported-codex-model>
      # reasoning_effort: <your-supported-reasoning-effort>
      command: [codex, exec, --sandbox, workspace-write, --output-last-message, "{output_file}", -]
      timeout_seconds: 3600
      # Opcional: usa o modo de revisao automatica do Codex CLI.
      # Ele implica workspace-write e nao pode ser combinado com --sandbox.
      # approval_policy: approve-for-me
    # Requer ADC (por exemplo, `gcloud auth application-default login`), nao uma API key.
    # vertex-gemini:
    #   type: gemini-vertex
    #   project: my-gcp-project
    #   location: global
    #   model: gemini-2.5-flash
    #   timeout_seconds: 900
    #   generation:
    #     temperature: 0.2
    #     # max_output_tokens: 8192
  integrations:
    github:
      command: [gh]
      timeout_seconds: 120
      # Configure an installed GitHub App for formal PR reviews; see docs/github_app.md.
      # Never version the private key.
      # app:
      #   app_id: 123456
      #   installation_id: 987654
      #   private_key_path: C:/secure/github-app-private-key.pem
      #   # Alternative: private_key_env: GITHUB_APP_PRIVATE_KEY

# Trello usa o custom field "Repository". Para GitHub Issues, prefira owner/repo.
repositories:
  example-api:
    path: /absolute/path/to/example-api
    repository:
      base_branch: develop
    validation:
      commands:
        - [python, -m, pytest]
        - [python, -m, ruff, check, .]
  owner/example-api:
    path: /absolute/path/to/example-api
