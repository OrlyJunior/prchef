task:
  # Provider usado com `orchestrator run --task-id ...`.
  # --trello-card e --github-issue selecionam explicitamente o provider.
  provider: github

defaults:
  # Persistent execution state is global, never repository-local. Relative paths
  # are resolved from this global configuration file.
  # persistence:
  #   database_path: state/orchestrator.db
  workspace:
    # Worktrees are created outside the configured repository checkout.
    root: C:/Git/orchestrator-workspaces
  repository:
    base_branch: develop
    protected_branches: [main, master, develop]
  # Orchestrator-owned retrieval policy. `heuristic` remains the default and
  # preserves the existing bounded planner snapshot and reviewer metadata behavior.
  repository_context:
    strategy: heuristic
    # To enable dense semantic retrieval for a registered repository, use:
    # strategy: qdrant
    # context_budget_chars: 12000
    # candidate_count: 12
    # chunk_size_chars: 1600
    # chunk_overlap_chars: 200
    # embedding:
    #   provider: fastembed
    #   model: BAAI/bge-small-en-v1.5
    #   version: "1"
    #   dimension: 384
    # qdrant:
    #   mode: local
    #   # Persistent and external to every repository. Omit for
    #   # ~/.orchestrator/qdrant. Local mode is single-process only.
    #   path: C:/Users/you/.orchestrator/qdrant
    # Server mode supports concurrent orchestrator processes instead:
    # qdrant:
    #   mode: server
    #   url: http://127.0.0.1:6333
    # Or use `host: 127.0.0.1` with optional `port: 6333`, not both URL and host.
  agents:
    planner:
      provider: cloud-api
      # Optional one-hop failover to a role-local named preset. It is used only
      # for quota, rate-limit, or temporary provider-capacity failures.
      # fallback_preset: cloud-backup
    implementer:
      provider: codex
    reviewer:
      provider: cloud-api
    # Exemplo optional de Vertex AI: a mesma instancia pode atender planner e reviewer.
    # planner:
    #   provider: vertex-gemini
    # reviewer:
    #   provider: vertex-gemini
  # Reusable launcher templates are role-local and never modify `providers`.
  # agent_presets:
  #   planner:
  #     cloud-backup:
  #       provider: cloud-api
  #       model: openai/gpt-4.1-mini
  #     # One Claude provider can use role-local permission modes without duplicate definitions.
  #     claude-read-only:
  #       provider: claude
  #       # Claude accepts low, medium, high, xhigh, or max per role.
  #       reasoning_effort: medium
  #       permission_mode: dontAsk
  #   implementer:
  #     focused:
  #       provider: codex
  #       model: <your-supported-codex-model>
  #       reasoning_effort: medium
  #     claude-edit:
  #       provider: claude
  #       permission_mode: acceptEdits
  safety:
    allow_direct_merge: false
    require_tests: true
  validation:
    auto_detect: true
    # `python -m pytest` usa .pytest-tmp/run automaticamente via pyproject.toml.
    commands: []
    # Tentativas de correcao no mesmo worktree apos uma validacao falhar.
    max_validation_retries: 2
  review:
    # Tentativas de correcao no mesmo worktree apos uma revisao pedir mudancas.
    # Cada correcao valida, cria um novo commit e atualiza a PR existente antes de nova revisao.
    max_review_retries: 1
  notifications:
    # Desktop alerts are opt-in. Windows is supported in this first version.
    enabled: false
    channel: desktop
  providers:
    codex:
      type: codex-cli
      # Fixe estes valores com opcoes suportadas pela sua Codex CLI; nao dependa do default externo.
      # model: <your-supported-codex-model>
      # reasoning_effort: <your-supported-reasoning-effort>
      command: [codex, exec, --sandbox, workspace-write, --output-last-message, "{output_file}", -]
      timeout_seconds: 3600
      # Opcional: usa o modo de revisao automatica do Codex CLI.
      # Ele implica workspace-write e nao pode ser combinado com --sandbox.
      # approval_policy: approve-for-me
    # Claude Code needs a recent `claude` CLI with `--output-format json`,
    # `--json-schema`, `--restricted`, and `--permission-prompts`. Authenticate outside this
    # YAML. Bare mode requires ANTHROPIC_API_KEY (or supported cloud-provider
    # credentials); it does not read subscription login/keychain credentials.
    # The provider always uses restricted, file-only tools in the supplied
    # workspace, so project/user hooks, MCP, Bash, and Git lifecycle actions
    # cannot be enabled by this configuration.
    # claude:
    #   type: claude-code
    #   executable: claude
    #   timeout_seconds: 1800
    #   # model: <your-supported-claude-model>
    #   # Optional native Claude thinking depth: low, medium, high, xhigh, or max.
    #   # When omitted, no --effort flag is sent and Claude's CLI default applies.
    #   # effort: medium
    #   # Default for roles without a preset/TUI runtime override. `dontAsk` is
    #   # suitable for read-only roles; use `acceptEdits` only for a role
    #   # permitted to edit the orchestrator-created workspace.
    #   permission_mode: dontAsk
    #   bare_mode: true
    #   # max_turns: 12
    #   # max_budget_usd: 5.00
    # Requer ADC (por exemplo, `gcloud auth application-default login`), nao uma API key.
    # vertex-gemini:
    #   type: gemini-vertex
    #   project: my-gcp-project
    #   location: global
    #   model: gemini-2.5-flash
    #   timeout_seconds: 900
    #   generation:
    #     temperature: 0.2
    #     # max_output_tokens: 8192
    # LiteLLM e o backend API-modelo de primeira classe e ja vem na instalacao normal.
    # Model identifiers are free-form. A key is referenced by its environment
    # variable name only; omit api_key_env for local/self-hosted endpoints.
    # local-ollama:
    #   type: litellm
    #   model: ollama/llama3.2
    #   api_base: http://localhost:11434
    #   timeout_seconds: 120
    #   temperature: 0.2
    #   max_output_tokens: 4096
    #   generation:
    #     top_p: 0.9
    cloud-api:
      type: litellm
      model: openai/gpt-4.1-mini
      api_key_env: OPENAI_API_KEY
    # Legacy/deprecated: Jules remains configurable only for existing setups.
    # It uses a remote-session API and does not meet current interactive worktree expectations.
    # jules:
    #   type: jules
    #   # source: sources/github-owner-repository
    #   poll_interval_seconds: 15
    #   timeout_seconds: 1800
  integrations:
    github:
      command: [gh]
      timeout_seconds: 120
      # Configure independent App identities for implementation and review; see docs/github_app.md.
      # Never version the private key.
      # implementer_app:
      #   app_id: 123456
      #   installation_id: 987654
      #   private_key_path: C:/secure/implementer-github-app-private-key.pem
      # app:
      #   app_id: 123456
      #   installation_id: 987654
      #   private_key_path: C:/secure/github-app-private-key.pem
      #   # Alternative: private_key_env: GITHUB_APP_PRIVATE_KEY

# Trello usa o custom field "Repository". Para GitHub Issues, prefira owner/repo.
repositories:
  example-api:
    path: /absolute/path/to/example-api
    repository:
      base_branch: develop
    validation:
      commands:
        - [python, -m, pytest]
        - [python, -m, ruff, check, .]
  owner/example-api:
    path: /absolute/path/to/example-api
